<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investment Workbench</title>
<style>
:root{--bg:#f2f4f3;--sf:#fff;--ink:#16211d;--mute:#667570;--line:#dde3e0;--pri:#0f5c5a;--up:#2e7d4f;--hold:#7a8790;--warn:#c0722a;--bad:#b3372f;--r:10px}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#101615;--sf:#171f1d;--ink:#e6ece9;--mute:#93a39d;--line:#2a3532;--pri:#5cc2b8;--up:#5fbf86;--hold:#8d9aa3;--warn:#e0924a;--bad:#e5766d}}
:root[data-t=dark]{--bg:#101615;--sf:#171f1d;--ink:#e6ece9;--mute:#93a39d;--line:#2a3532;--pri:#5cc2b8;--up:#5fbf86;--hold:#8d9aa3;--warn:#e0924a;--bad:#e5766d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}#list{flex:1;min-height:0;overflow:auto;margin:4px -6px;padding:0 6px}.co .nm{display:block;font-style:normal;font-size:12px;color:var(--mute);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gh i{font-style:normal;display:inline-block;width:12px;opacity:.7}
aside h1{font-size:15px;margin:0 0 14px;color:var(--pri)}
.co{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;border:0;background:none;color:inherit;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.co:hover,.co.on{background:var(--sf)}.co small{color:var(--mute)}
.add{display:flex;gap:6px;margin-top:12px}.add input{width:100%;min-width:0}
input,select,button{font:inherit;color:inherit}input,select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
.btn{white-space:nowrap;padding:7px 14px;border:0;border-radius:8px;background:var(--pri);color:var(--bg);cursor:pointer;font-weight:600}.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
main{padding:22px 28px 60px;max-width:980px;width:100%}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}.top h2 small{color:var(--mute);font-weight:400;font-size:14px;margin-left:8px}
.acts{display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;margin:16px 0 18px;border-bottom:1px solid var(--line)}
nav button{padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--pri);font-weight:600}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.hero{padding:22px 24px}.hero .one{font:600 20px/1.5 Georgia,"Times New Roman",serif;margin:10px 0 14px;max-width:34em}
.chip{display:inline-flex;gap:6px;align-items:center;padding:2px 11px;border-radius:99px;font-weight:600;font-size:13px;border:1px solid currentColor}
.constructive{color:var(--up)}.neutral{color:var(--hold)}.cautious{color:var(--warn)}
.strengthened{--c:var(--up)}.holding{--c:var(--hold)}.unverified{--c:var(--line)}.weakened{--c:var(--warn)}.broken{--c:var(--bad)}
.strip{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:8px 0 6px}.strip i{background:var(--c);flex:var(--n)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.meta{color:var(--mute);font-size:13px}.up{color:var(--up)}.dn{color:var(--bad)}
.row{padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border:0;padding-top:0}
.row b{display:block}.sub{color:var(--mute);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.grid .card{margin:0}
.big{font-size:22px;font-weight:600}svg{display:block;width:100%}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:18px}
.node{position:relative;padding:0 0 18px;cursor:pointer}.node:before{content:"";position:absolute;left:-26px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--hold));border:2px solid var(--bg)}
.node.check{opacity:.7}.node.check:before{background:var(--line)}.node.baseline:before,.node.rebaseline:before{--c:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chips span{font-size:12.5px;padding:1px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--c,var(--line))}
.banner{border-left:3px solid var(--warn);padding:8px 12px;background:var(--sf);border-radius:6px;margin-bottom:14px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
details summary{cursor:pointer;color:var(--mute);font-size:13px}.rep p{margin:.5em 0}.rep h4{margin:1em 0 .2em}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;max-width:90vw;display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border:0}main{padding:16px}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.hd{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}.eye{font-size:11.5px;letter-spacing:.09em;color:var(--mute);font-weight:600}
.hd h2{margin:2px 0 0;font-size:26px;letter-spacing:-.01em}.hd h2 span{font-weight:400;color:var(--mute)}.px{text-align:right;min-width:230px}.price{font-size:32px;font-weight:700;line-height:1.1}.px small{display:block;color:var(--mute)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tags span,.tags a{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:99px;background:var(--sf);text-decoration:none;color:var(--ink)}.tags a{color:var(--pri);font-weight:600}
.kv{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}h3+.kv{border:0}.kv span{flex:1;color:var(--mute)}.kv b{font-weight:600}.kv small{color:var(--mute);font-size:12px}.tag2{font-weight:400;font-size:12px;margin-left:6px;opacity:.8}
.rb{position:relative;height:6px;border-radius:99px;background:var(--line);margin:10px 0}.rb i{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px}.rb b{position:absolute;top:-1px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--pri)}
.cf{display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0}.cf span{width:42px;color:var(--mute)}.cf i{display:block;height:8px;border-radius:4px;background:var(--pri)}.cf i.neg{background:var(--bad)}.cf b{margin-left:auto;font-weight:600}
textarea{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--sf);font:inherit;resize:vertical}
.frm{display:flex;gap:8px;flex-wrap:wrap}.frm select{max-width:100%}.note{margin-top:4px;padding-left:10px;border-left:2px solid var(--line)}.acts2{margin-top:8px;display:flex;gap:8px}.btn.sm{padding:3px 10px;font-size:13px;font-weight:500}.nl{color:var(--ink);text-decoration:none;font-weight:600}.nl:hover{color:var(--pri);text-decoration:underline}
.gh{user-select:none;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:14px 0 4px 10px;cursor:pointer}.gh span{opacity:.7}.sd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn)}
table.ov{width:100%;border-collapse:collapse}.ov th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px 10px}.ov td{padding:10px;border-top:1px solid var(--line)}.ov tbody tr{cursor:pointer}.ov tbody tr:hover{background:var(--bg)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink);padding:20px;width:min(92vw,480px)}dialog::backdrop{background:#0008}.dh{margin:0 0 8px;font-size:17px}
.frm.col{flex-direction:column}.frm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.frm label input,.frm label select{width:100%}
.node.trade,.node.jn{cursor:default}.node.jn:before{border-radius:2px;--c:var(--warn)}.pre{white-space:pre-wrap}.jl{margin:6px 0 0;padding-left:18px}.jl li{margin:2px 0}.node.trade:before{border-radius:2px;--c:var(--pri)}

.ov th{background:var(--bg);text-transform:uppercase;font-size:11.5px;letter-spacing:.05em;color:var(--mute);position:sticky;top:0}
.card>h3{color:var(--ink);font-weight:700}
.grid .card{border-top:3px solid var(--pri)}.grid .card.w{border-top-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--sf))}.grid .card.b{border-top-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--sf))}
.big{font-weight:800}
.chip.constructive{background:color-mix(in srgb,var(--up) 14%,transparent)}.chip.cautious{background:color-mix(in srgb,var(--warn) 16%,transparent)}.chip.neutral{background:color-mix(in srgb,var(--hold) 14%,transparent)}
tr.v-cautious td:first-child{box-shadow:inset 3px 0 var(--warn)}tr.v-constructive td:first-child{box-shadow:inset 3px 0 var(--up)}tr.v-neutral td:first-child{box-shadow:inset 3px 0 var(--hold)}tr.v-na td:first-child{box-shadow:inset 3px 0 var(--line)}
.co.on{box-shadow:inset 3px 0 var(--pri);font-weight:700}
.wb{height:5px;border-radius:3px;background:var(--line);margin-top:4px;min-width:60px}.wb i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tb input[type=search]{flex:1;min-width:160px}.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0}.sbar i{display:block;height:100%}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;font-size:13.5px}.lg span{display:flex;align-items:center;gap:6px}.lg b{margin-left:auto}.lg u{display:inline-block;width:10px;height:10px;border-radius:3px;text-decoration:none}
.tip{display:inline-block;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:11px;font-weight:600;cursor:help;position:relative;margin-left:4px;text-transform:none;letter-spacing:0}
#tipbox{position:fixed;z-index:1000;display:none;width:320px;max-width:calc(100vw - 24px);white-space:pre-line;text-align:left;background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.5;font-weight:400;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;text-transform:none;letter-spacing:0}
#sq{width:100%;margin:0 0 8px}
</style></head><body>
<div class="app"><aside><h1>Investment Workbench</h1><button class="co" id="ovb">Overview</button><button class="co" id="pfb">Portfolio</button><button class="co" id="jnb">Journal</button><input id="sq" type="search" placeholder="Filter list…" aria-label="Filter sidebar"><div id="list"></div>
<div class="add"><input id="nt" placeholder="Add ticker" maxlength="16" aria-label="Ticker"><button class="btn ghost" id="addb">Add</button></div>
<div class="add"><button class="btn ghost" id="theme" style="width:100%">Toggle theme</button></div><div class="sub" id="usage" style="margin:10px 4px"></div><div class="sub" id="ver" style="margin:0 4px;opacity:.6"></div></aside>
<main><div id="head"></div><nav id="tabs"></nav><div id="view"><div class="empty">Select or add a company to begin.</div></div></main></div>
<dialog id="dlg"><div id="dlgb"></div></dialog>
<div id="toast" role="status"></div><div id="tipbox" role="tooltip"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={strengthened:"Strengthened",holding:"Holding",weakened:"Weakened",broken:"Broken",unverified:"Unverified"},VW={constructive:"Constructive",neutral:"Neutral",cautious:"Cautious"},
VC={up:"↑ Upgraded",down:"↓ Downgraded",unchanged:"",new:"Initial"},KD={baseline:"Baseline",rebaseline:"Rebuilt",update:"Update",check:"Check"},
TABS=[["brief","Brief"],["plan","Position & plan"],["thesis","Thesis"],["fund","Fundamentals"],["time","Timeline"],["notes","Notes"]],
NK={decision:"Decision log",comment:"Comment on assumption",source:"External source",question:"Question to revisit"};
let T=null,tab="brief",lang="en",VL="en";const LQ=u=>VL==="zh"?u+(u.includes("?")?"&":"?")+"lang=zh":u;
const pct=v=>v==null?"—":(v>0?"+":"")+(v*100).toFixed(1)+"%",dt=v=>v?new Date(v).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4500)};
async function api(u,o){const r=await fetch("/api/v1"+u,o),d=await r.json().catch(()=>({}));if(!r.ok){const x=d.detail;throw new Error(typeof x==="string"?x:x?.message||"Request failed "+r.status)}return d}
function spark(pts,h=44,mark=[]){const v=pts.filter(p=>p.v!=null);if(v.length<2)return'<div class="sub">Not enough data</div>';const ys=v.map(p=>p.v),a=Math.min(...ys),b=Math.max(...ys),s=b-a||1,W=200,x=i=>i/(v.length-1)*W,y=n=>h-4-(n-a)/s*(h-8);
return`<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px"><polyline fill="none" stroke="var(--pri)" stroke-width="1.8" vector-effect="non-scaling-stroke" points="${v.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>${mark.map(i=>`<circle cx="${x(i)}" cy="${y(v[i].v)}" r="3.2" fill="var(--pri)"/>`).join("")}</svg>`}
const big=v=>{if(v==null)return"—";const a=Math.abs(v);return(v<0?"-":"")+"$"+(a>=1e12?(a/1e12).toFixed(2)+"T":a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(0)+"M":a.toFixed(0))},
Pc=v=>v==null?"—":(v*100).toFixed(1)+"%",Pp=v=>v==null?"—":(+v).toFixed(1)+"%",Yl=v=>v==null?"—":(v>.2?+v:v*100).toFixed(2)+"%",Xx=v=>v==null?"—":(+v).toFixed(1)+"x",Nn=v=>v==null?"—":(+v).toFixed(2),Dl=v=>v==null?"—":"$"+(+v).toFixed(2),
rb=(lo,hi,v,m)=>{if(lo==null||hi==null||!(hi>lo))return"";const p=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));return`<div class="rb">${m!=null?`<b style="left:${p(m)}%"></b>`:""}<i style="left:${p(v)}%"></i></div>`},
G=[["Valuation","Price-sensitive",[["valuation","pe_ttm","P/E (TTM)",Xx],["valuation","forward_pe","Forward P/E",Xx],["valuation","peg","PEG",Xx],["valuation","ev_to_ebitda","EV / EBITDA",Xx],["valuation","ev_to_sales","EV / Sales",Xx],["valuation","price_to_book","Price / Book",Xx],["valuation","free_cash_flow_yield","FCF yield",Yl],["valuation","dividend_yield","Dividend yield",Yl]]],
["Growth & profitability","Fundamental · TTM / latest reported",[["financial_health","revenue_growth","Revenue growth",Pc],["financial_health","earnings_growth","Earnings growth",Pc],["financial_health","gross_margin","Gross margin",Pc],["financial_health","operating_margin","Operating margin",Pc],["financial_health","profit_margin","Net margin",Pc],["financial_health","return_on_equity","Return on equity",Pc],["financial_health","return_on_invested_capital","ROIC",Pc]]],
["Balance sheet","Fundamental · latest reported",[["financial_health","debt_to_equity","Debt / equity",Pp],["financial_health","current_ratio","Current ratio",Nn],["financial_health","quick_ratio","Quick ratio",Nn],["financial_health","payout_ratio","Payout ratio",Pc]]]];
let DK=null,PF=[],LB=null,CUR="home";
const PS={stop_breached:["Stop breached","bad"],near_stop:["Near stop","warn"],target_reached:["Target reached","up"],near_target:["Near target","up"],buy_zone:["In buy zone","pri"],on_plan:["On plan","hold"]},STY={investment:"Investment",trade:"Trade",defensive:"Defensive"},
pchip=ps=>ps?`<span class="chip" style="color:var(--${PS[ps.status][1]})">${PS[ps.status][0]}</span>`:"";
const showDlg=h=>{$("#dlgb").innerHTML=h;const d=$("#dlg");if(!d.open)d.showModal()},hideDlg=()=>{const d=$("#dlg");if(d.open)d.close()};
const askConfirm=(title,msg,typed)=>new Promise(r=>{DK=r;showDlg(`<h3 class="dh">${E(title)}</h3><div class="sub">${E(msg)}</div>${typed?`<input id="dlgin" data-need="${E(typed)}" placeholder="Type ${E(typed)} to confirm" style="width:100%;margin-top:10px" autocomplete="off">`:""}<div class="acts" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="dlgno">Cancel</button><button class="btn" id="dlgyes"${typed?" disabled":""}>Confirm</button></div>`)});
function planDlg(sym,p){p=p||{};showDlg(`<h3 class="dh">Position plan · ${E(sym)}</h3><div class="frm col"><label>Style<select id="pl-style">${Object.entries(STY).map(([k,v])=>`<option value="${k}"${p.style===k?" selected":""}>${v}</option>`).join("")}</select></label><label>Buy at or below (target cost)<input id="pl-buy" type="number" step="any" min="0" value="${p.buy_below??""}"></label><label>Target price<input id="pl-tgt" type="number" step="any" min="0" value="${p.target_price??""}"></label><label>Stop price<input id="pl-stop" type="number" step="any" min="0" value="${p.stop_price??""}"></label><label>Rules (add / trim / exit)<textarea id="pl-rules" rows="3" placeholder="e.g. trim 30% at +15%; add 30% at -5%">${E(p.rules||"")}</textarea></label></div><div class="acts" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="dlgno">Cancel</button>${p.style?`<button class="btn ghost" id="plclr" data-s="${E(sym)}">Remove plan</button>`:""}<button class="btn" id="plsave" data-s="${E(sym)}">Save plan</button></div>`)}
const planCard=b=>{const p=b.plan,s=b.plan_status,po=b.position,cu=({HKD:"HK$",SGD:"S$"})[po?.currency]||"$";
return`<div class="card"><h3>Your position &amp; plan <button class="btn ghost sm" id="planb" style="float:right">${p?"Edit plan":"Set plan"}</button></h3>${po?`<div class="kv"><span>Position</span><b>${po.quantity} sh · cost ${po.cost!=null?cu+(+po.cost).toFixed(2):"—"} · P&amp;L ${Pc(po.pnl_pct)} · weight ${Pc(po.weight)}</b></div>`:'<div class="sub">Not in your imported holdings.</div>'}${p?`<div class="kv"><span>${STY[p.style]}</span><b>${pchip(s)}</b></div><div class="kv"><span>Buy ≤ / Target / Stop</span><b>${[p.buy_below,p.target_price,p.stop_price].map(v=>v==null?"—":cu+v).join(" / ")}</b></div>${s?`<div class="sub">${s.to_target!=null?"To target "+pct(s.to_target):""}${s.to_target!=null&&s.to_stop!=null?" · ":""}${s.to_stop!=null?"To stop "+pct(s.to_stop):""}</div>`:""}${p.rules?`<div class="sub note" style="margin-top:6px">${E(p.rules)}</div>`:""}`:'<div class="sub">No plan yet. Add your own target, stop and add/trim rules.</div>'}</div>`};
const STG={long_term:"Long-term hold",swing:"Swing",short_term:"Short-term trade",defensive:"Defensive / hedge",rebalance:"Rebalance / swap"},CU=c=>({HKD:"HK$",SGD:"S$"})[c]||"$";let TR={};
