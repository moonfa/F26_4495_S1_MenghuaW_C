<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investment Workbench</title>
<style>
:root{--bg:#f2f4f3;--sf:#fff;--ink:#16211d;--mute:#667570;--line:#dde3e0;--pri:#0f5c5a;--up:#2e7d4f;--hold:#7a8790;--warn:#c0722a;--bad:#b3372f;--r:10px}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#101615;--sf:#171f1d;--ink:#e6ece9;--mute:#93a39d;--line:#2a3532;--pri:#5cc2b8;--up:#5fbf86;--hold:#8d9aa3;--warn:#e0924a;--bad:#e5766d}}
:root[data-t=dark]{--bg:#101615;--sf:#171f1d;--ink:#e6ece9;--mute:#93a39d;--line:#2a3532;--pri:#5cc2b8;--up:#5fbf86;--hold:#8d9aa3;--warn:#e0924a;--bad:#e5766d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:15px;margin:0 0 14px;color:var(--pri)}
.co{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;border:0;background:none;color:inherit;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.co:hover,.co.on{background:var(--sf)}.co small{color:var(--mute)}
.add{display:flex;gap:6px;margin-top:12px}.add input{width:100%;min-width:0}
input,select,button{font:inherit;color:inherit}input,select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
.btn{white-space:nowrap;padding:7px 14px;border:0;border-radius:8px;background:var(--pri);color:var(--bg);cursor:pointer;font-weight:600}.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
main{padding:22px 28px 60px;max-width:980px;width:100%}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}.top h2 small{color:var(--mute);font-weight:400;font-size:14px;margin-left:8px}
.acts{display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;margin:16px 0 18px;border-bottom:1px solid var(--line)}
nav button{padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--pri);font-weight:600}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.hero{padding:22px 24px}.hero .one{font:600 20px/1.5 Georgia,"Times New Roman",serif;margin:10px 0 14px;max-width:34em}
.chip{display:inline-flex;gap:6px;align-items:center;padding:2px 11px;border-radius:99px;font-weight:600;font-size:13px;border:1px solid currentColor}
.constructive{color:var(--up)}.neutral{color:var(--hold)}.cautious{color:var(--warn)}
.strengthened{--c:var(--up)}.holding{--c:var(--hold)}.unverified{--c:var(--line)}.weakened{--c:var(--warn)}.broken{--c:var(--bad)}
.strip{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:8px 0 6px}.strip i{background:var(--c);flex:var(--n)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.meta{color:var(--mute);font-size:13px}.up{color:var(--up)}.dn{color:var(--bad)}
.row{padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border:0;padding-top:0}
.row b{display:block}.sub{color:var(--mute);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.grid .card{margin:0}
.big{font-size:22px;font-weight:600}svg{display:block;width:100%}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:18px}
.node{position:relative;padding:0 0 18px;cursor:pointer}.node:before{content:"";position:absolute;left:-26px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--hold));border:2px solid var(--bg)}
.node.check{opacity:.7}.node.check:before{background:var(--line)}.node.baseline:before,.node.rebaseline:before{--c:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chips span{font-size:12.5px;padding:1px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--c,var(--line))}
.banner{border-left:3px solid var(--warn);padding:8px 12px;background:var(--sf);border-radius:6px;margin-bottom:14px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
details summary{cursor:pointer;color:var(--mute);font-size:13px}.rep p{margin:.5em 0}.rep h4{margin:1em 0 .2em}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;max-width:90vw;display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border:0}main{padding:16px}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.hd{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}.eye{font-size:11.5px;letter-spacing:.09em;color:var(--mute);font-weight:600}
.hd h2{margin:2px 0 0;font-size:26px;letter-spacing:-.01em}.hd h2 span{font-weight:400;color:var(--mute)}.px{text-align:right;min-width:230px}.price{font-size:32px;font-weight:700;line-height:1.1}.px small{display:block;color:var(--mute)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tags span,.tags a{font-size:12.5px;padding:2px 10px;border:1px solid var(--line);border-radius:99px;background:var(--sf);text-decoration:none;color:var(--ink)}.tags a{color:var(--pri);font-weight:600}
.kv{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}h3+.kv{border:0}.kv span{flex:1;color:var(--mute)}.kv b{font-weight:600}.kv small{color:var(--mute);font-size:12px}.tag2{font-weight:400;font-size:12px;margin-left:6px;opacity:.8}
.rb{position:relative;height:6px;border-radius:99px;background:var(--line);margin:10px 0}.rb i{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px}.rb b{position:absolute;top:-1px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--pri)}
.cf{display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0}.cf span{width:42px;color:var(--mute)}.cf i{display:block;height:8px;border-radius:4px;background:var(--pri)}.cf i.neg{background:var(--bad)}.cf b{margin-left:auto;font-weight:600}
textarea{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--sf);font:inherit;resize:vertical}
</style></head><body>
<div class="app"><aside><h1>Investment Workbench</h1><div id="list"></div>
<div class="add"><input id="nt" placeholder="Add ticker" maxlength="16" aria-label="Ticker"><button class="btn ghost" id="addb">Add</button></div>
<div class="add"><button class="btn ghost" id="theme" style="width:100%">Toggle theme</button></div></aside>
<main><div id="head"></div><nav id="tabs"></nav><div id="view"><div class="empty">Select or add a company to begin.</div></div></main></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={strengthened:"Strengthened",holding:"Holding",weakened:"Weakened",broken:"Broken",unverified:"Unverified"},VW={constructive:"Constructive",neutral:"Neutral",cautious:"Cautious"},
VC={up:"↑ Upgraded",down:"↓ Downgraded",unchanged:"",new:"Initial"},KD={baseline:"Baseline",rebaseline:"Rebuilt",update:"Update",check:"Check"},
TABS=[["brief","Brief"],["thesis","Thesis"],["fund","Fundamentals"],["time","Timeline"],["notes","Notes"]],
NK={general:"Note",hypothesis:"Thesis comment",valuation_assumption:"Valuation assumption",planned_action:"Planned action / trade",review_outcome:"Review outcome",external_source:"External source"};
let T=null,tab="brief",lang="en";
const pct=v=>v==null?"—":(v>0?"+":"")+(v*100).toFixed(1)+"%",dt=v=>v?new Date(v).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4500)};
async function api(u,o){const r=await fetch("/api/v1"+u,o),d=await r.json().catch(()=>({}));if(!r.ok){const x=d.detail;throw new Error(typeof x==="string"?x:x?.message||"Request failed "+r.status)}return d}
function spark(pts,h=44,mark=[]){const v=pts.filter(p=>p.v!=null);if(v.length<2)return'<div class="sub">Not enough data</div>';const ys=v.map(p=>p.v),a=Math.min(...ys),b=Math.max(...ys),s=b-a||1,W=200,x=i=>i/(v.length-1)*W,y=n=>h-4-(n-a)/s*(h-8);
return`<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px"><polyline fill="none" stroke="var(--pri)" stroke-width="1.8" vector-effect="non-scaling-stroke" points="${v.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>${mark.map(i=>`<circle cx="${x(i)}" cy="${y(v[i].v)}" r="3.2" fill="var(--pri)"/>`).join("")}</svg>`}
const big=v=>{if(v==null)return"—";const a=Math.abs(v);return(v<0?"-":"")+"$"+(a>=1e12?(a/1e12).toFixed(2)+"T":a>=1e9?(a/1e9).toFixed(2)+"B":a>=1e6?(a/1e6).toFixed(0)+"M":a.toFixed(0))},
Pc=v=>v==null?"—":(v*100).toFixed(1)+"%",Pp=v=>v==null?"—":(+v).toFixed(1)+"%",Yl=v=>v==null?"—":(v>.2?+v:v*100).toFixed(2)+"%",Xx=v=>v==null?"—":(+v).toFixed(1)+"x",Nn=v=>v==null?"—":(+v).toFixed(2),Dl=v=>v==null?"—":"$"+(+v).toFixed(2),
rb=(lo,hi,v,m)=>{if(lo==null||hi==null||!(hi>lo))return"";const p=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));return`<div class="rb">${m!=null?`<b style="left:${p(m)}%"></b>`:""}<i style="left:${p(v)}%"></i></div>`},
G=[["Valuation","Price-sensitive",[["valuation","pe_ttm","P/E (TTM)",Xx],["valuation","forward_pe","Forward P/E",Xx],["valuation","peg","PEG",Xx],["valuation","ev_to_ebitda","EV / EBITDA",Xx],["valuation","ev_to_sales","EV / Sales",Xx],["valuation","price_to_book","Price / Book",Xx],["valuation","free_cash_flow_yield","FCF yield",Yl],["valuation","dividend_yield","Dividend yield",Yl]]],
["Growth & profitability","Fundamental · TTM / latest reported",[["financial_health","revenue_growth","Revenue growth",Pc],["financial_health","earnings_growth","Earnings growth",Pc],["financial_health","gross_margin","Gross margin",Pc],["financial_health","operating_margin","Operating margin",Pc],["financial_health","profit_margin","Net margin",Pc],["financial_health","return_on_equity","Return on equity",Pc],["financial_health","return_on_invested_capital","ROIC",Pc]]],
["Balance sheet","Fundamental · latest reported",[["financial_health","debt_to_equity","Debt / equity",Pp],["financial_health","current_ratio","Current ratio",Nn],["financial_health","quick_ratio","Quick ratio",Nn],["financial_health","payout_ratio","Payout ratio",Pc]]]];
async function companies(){const l=await api("/companies");$("#list").innerHTML=l.map(c=>`<button class="co ${c.ticker===T?"on":""}" data-t="${E(c.ticker)}"><span>${E(c.ticker)}</span><small class="${c.view||""}">${VW[c.view]||""}</small></button>`).join("")||'<div class="sub">No companies yet</div>'}
function head(b){const q=b?.quote||{},us=v=>v==null?"—":(!q.currency||q.currency==="USD"?"$":"")+(+v).toFixed(2),ch=q.day_change_pct;
$("#head").innerHTML=`<div class="hd"><div><div class="eye">COMPANY RESEARCH WORKSPACE</div><h2>${E(T)}${b?` <span>· ${E(b.name)}</span>`:""}</h2>${q.sector?`<div class="sub">${E(q.sector)}${q.industry?" · "+E(q.industry):""}</div>`:""}
<div class="tags"><a href="${E(q.yahoo_url||"https://finance.yahoo.com/quote/"+T)}" target="_blank" rel="noopener">Yahoo Finance ↗</a>${q.market_cap?`<span>Mkt cap ${big(q.market_cap)}</span>`:""}${q.target?`<span>Analyst target ${us(q.target)}${q.target_upside_pct!=null?` (${pct(q.target_upside_pct)})`:""}</span>`:""}${b?`<span>Analysed ${dt(b.analysed_at)}</span>`:""}</div></div>
<div class="px">${q.price!=null?`<div class="price">${us(q.price)}</div><small class="${ch>=0?"up":"dn"}">${ch!=null?pct(ch)+" today":"&nbsp;"}</small>`:""}${q.year_low!=null?`<small>52W ${us(q.year_low)} – ${us(q.year_high)}</small>${rb(q.year_low,q.year_high,q.price)}`:""}<button class="btn" id="upd" style="margin-top:10px">Update</button></div></div>`;
$("#tabs").innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?"on":""}" data-k="${k}">${n}</button>`).join("")}
async function refresh(force){if(!T)return;if(!$("#upd"))head(null);const b=$("#upd");b.disabled=true;b.textContent="Analysing…";try{const r=await api(`/companies/${T}/refresh`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:lang,force_rebaseline:!!force})});toast(r.llm_called?"Analysis complete: "+r.level_reason:"No thesis-relevant change; no model call. "+r.level_reason)}catch(e){toast(e.message)}await open(T)}
async function open(t){T=t;await companies();show()}
async function show(){if(!T)return;let b=null;try{b=await api(`/companies/${T}/brief`)}catch{}head(b);const v=$("#view");
if(!b){v.innerHTML='<div class="empty">No analysis yet. Click Update to build the thesis baseline.</div>';return}
v.innerHTML='<div class="empty">Loading…</div>';try{v.innerHTML=await({brief:()=>brief(b),thesis,fund,time,notes})[tab]()}catch(e){v.innerHTML=`<div class="empty">${E(e.message)}</div>`}}
function brief(b){const n=Object.entries(b.health),tot=n.reduce((s,[,c])=>s+c,0)||1,ch=b.top_changes||[],pc=b.price_since_analysis_pct;
return`${b.rebaseline_suggested?'<div class="banner">The model suggests rebuilding the thesis (the business model or management may have changed).<button class="btn ghost" id="rb" style="margin-left:8px">Rebuild baseline</button></div>':""}
<div class="card hero"><span class="chip ${b.view}">${VW[b.view]}${VC[b.view_change]?" · "+VC[b.view_change]:""}</span><div class="one">${E(b.one_liner)}</div>
<div class="strip">${n.map(([k,c])=>`<i class="${k}" style="--n:${c}" title="${ST[k]} ${c}"></i>`).join("")}</div>
<div class="legend">${n.map(([k,c])=>`<span class="${k}"><i class="dot"></i>${ST[k]} ${c}/${tot}</span>`).join("")}</div>
<div class="meta" style="margin-top:12px">Analysed ${dt(b.analysed_at)} · Last checked ${dt(b.checked_at)}${b.last_check_level==="none"&&b.meta.kind!=="baseline"?" · no thesis-relevant change":""}${pc!=null&&Math.abs(pc)>=.005?` · price ${pct(pc)} since analysis`:""}</div></div>
<div class="card"><h3>Recent changes</h3>${ch.length?ch.map(c=>`<div class="row"><b>${E(c.what)}</b><span class="sub">${E(c.so_what)}</span></div>`).join(""):'<div class="sub">Baseline analysis — no changes recorded yet.</div>'}</div>
<div class="card"><h3>Core assumptions</h3>${b.assumptions.map(a=>`<div class="row ${a.status}"><span class="chip" style="color:var(--c)">${ST[a.status]}</span>${a.prev_status&&a.prev_status!==a.status?` <span class="sub">was ${ST[a.prev_status]}</span>`:""} ${E(a.statement)}<div class="sub">Kill criteria: ${E(a.kill_criteria)}</div></div>`).join("")}</div>
<div class="card"><h3>What to watch next</h3>${b.monitor.map(m=>`<div class="row"><b>${E(m.indicator)}</b><span class="sub">${E(m.trigger)} · ${E(m.why)}</span></div>`).join("")}</div>
<details><summary>Analysis details</summary><div class="meta">model ${E(b.meta.model||"—")} · prompt ${E(b.meta.prompt_version)} · review #${b.meta.review_id} · tokens ${E(JSON.stringify(b.meta.usage||{}))}</div></details>`}
const md=t=>String(t||"").split("\n").map(l=>/^#+\s/.test(l)?`<h4>${E(l.replace(/^#+\s/,""))}</h4>`:l.trim()?`<p>${E(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</p>`:"").join("");
async function thesis(){const t=await api(`/companies/${T}/thesis`),p=t.profile,f=(l,v)=>`<div class="row"><b>${l}</b><span class="sub">${v}</span></div>`;
return`<div class="card"><h3>Assumptions & status history</h3>${t.assumptions.map(a=>`<div class="row ${a.status}"><span class="chip" style="color:var(--c)">${ST[a.status]}</span> ${E(a.statement)}<div class="sub">Kill criteria: ${E(a.kill_criteria)}</div>${a.evidence.length?`<div class="sub">Evidence: ${a.evidence.map(E).join("; ")}</div>`:""}<div class="legend" style="margin-top:6px">${a.history.map(h=>`<span class="${h.status}" title="${dt(h.at)} ${ST[h.status]}"><i class="dot"></i></span>`).join("")}</div></div>`).join("")}</div>
<div class="card"><h3>Company profile (${E(p.classification)})</h3>${f("Business model",E(p.business_model))}${f("Moat",E(p.moat))}${f("Key drivers",p.key_drivers.map(E).join("; "))}${f("Risk mechanisms",p.key_risks.map(E).join("; "))}${f("Strongest bear case",E(p.bear_case))}${f("What the price implies",E(p.valuation_view))}</div>
<details class="card rep"><summary>Full baseline report</summary>${md(t.report_markdown)}</details>`}
async function fund(){const d=await api(`/companies/${T}/fundamentals`),N=d.now,A=d.at_analysis||{},px=N.market?.current_price,an=N.analyst_consensus||{},fh=N.financial_health||{};
const card=([t,n,rows])=>`<div class="card"><h3>${t} <span class="tag2">${n}</span></h3>${rows.map(([sec,k,l,f])=>{const v=N[sec]?.[k];if(v==null)return"";const o=A[sec]?.[k],c=o!=null&&Math.abs(v-o)>Math.abs(o)*.01;return`<div class="kv"><span>${l}</span><b>${f(v)}</b>${c?`<small>was ${f(o)}</small>`:""}</div>`}).join("")}</div>`;
const cf=(fh.cash_flow_history||[]).filter(r=>r.free_cash_flow!=null).slice().reverse(),mx=Math.max(1,...cf.map(r=>Math.abs(r.free_cash_flow)));
const up=an.target_consensus&&px?an.target_consensus/px-1:null;
return`<div class="grid">${G.map(card).join("")}
<div class="card"><h3>Analyst consensus <span class="tag2">Forward-looking</span></h3>${[["Consensus target",an.target_consensus],["Median target",an.target_median],["High",an.target_high],["Low",an.target_low]].map(([l,v])=>v==null?"":`<div class="kv"><span>${l}</span><b>${Dl(v)}</b></div>`).join("")}${up!=null?`<div class="kv"><span>Implied vs price</span><b class="${up>=0?"up":"dn"}">${pct(up)}</b></div>`:""}${rb(an.target_low,an.target_high,px,an.target_consensus)}<div class="sub">Line = current price · dot = consensus${an.total_analysts?` · ${an.total_analysts} analysts`:""}</div></div>
${cf.length?`<div class="card"><h3>Free cash flow <span class="tag2">Annual</span></h3>${cf.map(r=>`<div class="cf"><span>${E(r.fiscal_year||String(r.period_ending||"").slice(0,4))}</span><i class="${r.free_cash_flow<0?"neg":""}" style="width:${Math.abs(r.free_cash_flow)/mx*60}%"></i><b>${big(r.free_cash_flow)}</b></div>`).join("")}</div>`:""}</div>
<div class="meta" style="margin-top:12px">Data as of ${dt(d.as_of)} · Yahoo Finance via OpenBB · "was" shows the value at the last analysis when it moved more than 1%.</div>`}
async function time(){const r=await api(`/companies/${T}/timeline`);
return`<div class="tl">${[...r].reverse().map((x,i,a)=>{const pv=a[i+1]?.price,pc=x.price&&pv?x.price/pv-1:null;return`<div class="node ${x.kind}" data-id="${x.id}" style="--c:var(--${x.view==="constructive"?"up":x.view==="cautious"?"warn":"hold"})"><b>${dt(x.created_at)} · ${KD[x.kind]}</b>${x.kind!=="check"?` <span class="chip ${x.view}">${VW[x.view]}${VC[x.view_change]?" "+VC[x.view_change]:""}</span>`:""} <span class="sub">${x.price!=null?"$"+(+x.price).toFixed(2):""}${pc!=null?" ("+pct(pc)+")":""}</span>
<div>${x.kind==="check"?`<span class="sub">${E(x.level_reason)}</span>`:E(x.one_liner)}</div>
${x.assumption_changes.length?`<div class="chips">${x.assumption_changes.map(a=>`<span class="${a.to}">${E(a.id)} ${a.from?ST[a.from]+" → ":""}${ST[a.to]}</span>`).join("")}</div>`:""}<div class="x"></div></div>`}).join("")}</div>`}
async function notes(){const n=await api(`/companies/${T}/notes`);
return`<div class="card"><h3>Add a note</h3><select id="nk" aria-label="Note type">${Object.entries(NK).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><textarea id="nb" rows="4" placeholder="Your view, a trade, a source or link, a question to revisit…"></textarea><div style="margin-top:8px"><button class="btn" id="nsave">Save note</button></div></div>
${n.length?n.map(x=>`<div class="card"><span class="chip">${NK[x.kind]||x.kind}</span> <span class="meta">${dt(x.created_at)}</span><div class="rep">${md(x.body)}</div></div>`).join(""):'<div class="empty">No notes yet. Notes are private to this workbench and are not sent to the model.</div>'}`}
document.addEventListener("click",async e=>{const c=e.target.closest(".co");if(c)return open(c.dataset.t);const k=e.target.closest("#tabs button");if(k){tab=k.dataset.k;return show()}
if(e.target.id==="upd")return refresh(false);if(e.target.id==="rb")return refresh(true);
if(e.target.id==="addb"){const t=$("#nt").value.trim().toUpperCase();if(t){T=t;$("#nt").value="";return refresh(false)}}
if(e.target.id==="theme"){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#101615";r.dataset.t=d?"light":"dark";return}
if(e.target.id==="nsave"){const body=$("#nb").value.trim();if(!body)return;await api(`/companies/${T}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({body,kind:$("#nk").value})});return show()}
const n=e.target.closest(".node");if(n){const x=n.querySelector(".x");if(x.innerHTML){x.innerHTML="";return}if(n.classList.contains("check"))return;const d=await api("/reviews/"+n.dataset.id);x.innerHTML=`<div class="card rep" style="margin-top:8px">${(d.changes||[]).map(c=>`<div class="row"><b>${E(c.what)}</b><span class="sub">${E(c.so_what)}</span></div>`).join("")}${md(d.narrative)}</div>`}});
document.addEventListener("change",e=>{if(e.target.id==="lang")lang=e.target.value});
companies().then(l=>{});
</script></body></html>
